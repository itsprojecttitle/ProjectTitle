<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Yellow Copy Logo</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 235.35px;
        height: 45.88px;
        background: transparent;
      }

      svg {
        display: block;
        width: 235.35px;
        height: 45.88px;
      }
    </style>
  </head>
  <body>
    <svg
      xmlns="http://www.w3.org/2000/svg"
      viewBox="0 0 235.35 45.88"
      aria-label="ProjectTitle logo"
      role="img"
    >
      <defs>
        <style>
          .cls-1,
          .cls-2,
          .cls-3 {
            isolation: isolate;
          }

          .cls-2 {
            fill: #a52116;
          }

          .cls-2,
          .cls-3 {
            font-family: CompactaBT-Black, "Compacta Black BT";
            font-size: 40.18px;
            font-weight: 800;
          }

          .cls-3 {
            fill: #030000;
          }
        </style>
      </defs>
      <g id="Layer_1-2" data-name="Layer 1">
        <g id="Yellow_copy" data-name="Yellow copy">
          <g>
            <g class="cls-1">
              <text
                class="cls-2"
                transform="translate(152.53 36.4) scale(.72 1)"
              >
                <tspan x="0" y="0">TITLE</tspan>
              </text>
            </g>
            <g class="cls-1">
              <text class="cls-3" transform="translate(0 36.4) scale(.72 1)">
                <tspan x="0" y="0">PROJECT</tspan>
              </text>
            </g>
          </g>
        </g>
      </g>
    </svg>
  </body>
</html>
